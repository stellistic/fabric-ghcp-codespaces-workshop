name: Offline workshop gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.3"
      - name: Install pinned environment manager
        run: python -m pip install uv==0.12.5
      - name: Restore locked dependencies
        run: uv sync --frozen
      - name: Tests, lint, dictionary, monthly regression, links and notebook validity
        run: make gates
      - name: Exercise participant offline commands
        run: |
          make offline
          make report.fault
          if make report.check; then
            echo "Seeded reporting defect unexpectedly passed" >&2
            exit 1
          fi
          make report.plan
          # Automated approval is ONLY for this offline synthetic regression.
          export APPROVE_PLAN="$(uv run python -c "import json; print(json.load(open('results/repair-plan.json'))['sha256'])")"
          make report.repair
          make report.check
