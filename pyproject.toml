[project]
name = "github-copilot-workshop"
version = "1.0.0"
description = "Reusable GitHub Copilot workshop targeting Microsoft Fabric."
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.5", "nbformat==5.10.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tools/notebooks/src", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
